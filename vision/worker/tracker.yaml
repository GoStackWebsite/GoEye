# ByteTrack settings tuned for a fixed surveillance camera.
tracker_type: bytetrack
track_high_thresh: 0.3    # first-pass association threshold; the nano detector scores seated, half-hidden people 0.35-0.55
track_low_thresh: 0.1     # second-pass (low-confidence) threshold
new_track_thresh: 0.35    # confidence needed to start a new track; at 0.6 those people never got an id and were not counted
track_buffer: 60          # frames to keep a lost track alive (~4s at 15 fps)
match_thresh: 0.8         # IoU matching threshold
fuse_score: true
