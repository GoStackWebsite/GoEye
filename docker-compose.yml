services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goeye
      POSTGRES_PASSWORD: goeye
      POSTGRES_DB: goeye
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  vision:
    build: .
    command: python -m vision.supervisor
    environment: &env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://goeye:goeye@postgres:5432/goeye
    depends_on: [redis]

  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment: *env
    ports: ["8000:8000"]
    depends_on: [redis, postgres]

  event_writer:
    build: .
    command: python -m backend.modules.events.consumer
    environment: *env
    depends_on: [redis, postgres]

  web:
    image: node:20
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host"
    volumes: ["./web:/web"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
